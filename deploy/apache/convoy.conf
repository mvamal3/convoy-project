# Convoy Management System - Apache configuration (include in the HTTPS vhost
# for staggingws.andaman.nic.in). Needs: mod_proxy, mod_proxy_http,
# mod_headers, mod_rewrite.
#
# The frontend is served from /convoy and the Node API is reverse-proxied at
# /convoy/api, so the browser only ever talks to this origin:
#   - no private IP (10.168.2.35) in the JavaScript bundle
#   - CSP connect-src can stay 'self'
#   - auth cookies are same-origin
#
# Build the frontend with:   VITE_API_BASE_URL=https://staggingws.andaman.nic.in/convoy
# Backend .env:              HOST=127.0.0.1 (or the internal IP)  TRUST_PROXY=1
#                            ALLOWED_ORIGINS=https://staggingws.andaman.nic.in
#                            NODE_ENV=production

# ---- Frontend (dist/) ----------------------------------------------------
Alias /convoy /var/www/convoy/dist
<Directory /var/www/convoy/dist>
    Options -Indexes -FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# VAPT #8: block dotfiles server-wide, even where .htaccess is not honoured
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|env)">
    Require all denied
</DirectoryMatch>

# Hide server version details
ServerSignature Off
# (ServerTokens Prod and TraceEnable Off must be set in the main server
#  config, not a vhost; TraceEnable Off disables the TRACE method)

# Disable OPTIONS (and other unused methods) on the frontend and the API.
# The API is same-origin behind this proxy, so browsers never send CORS
# preflight OPTIONS requests to it.
<Location /convoy>
    <LimitExcept GET HEAD POST PUT DELETE>
        Require all denied
    </LimitExcept>
</Location>
<LocationMatch "^/convoy/(?!api/)">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</LocationMatch>

# ---- API reverse proxy ---------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

ProxyPass        /convoy/api/ http://127.0.0.1:3000/api/
ProxyPassReverse /convoy/api/ http://127.0.0.1:3000/api/
# The API sets its refresh-token cookie on path /api/auth
ProxyPassReverseCookiePath /api /convoy/api
